# Configuration de l'application Bordereaux.
# Modifier ce fichier avec le Bloc-notes (enregistrer en UTF-8), puis relancer l'application.

[general]
# Dossier où sont rangés les bordereaux et l'index.
# Vide = dossier privé de l'utilisateur Windows : %LOCALAPPDATA%\BordereauxApp
dossier_donnees =

# Chemin de soffice.exe si LibreOffice n'est pas détecté automatiquement
# (exemple : C:\Program Files\LibreOffice\program\soffice.exe).
libreoffice =

[document]
# Première ligne en haut à gauche. {numero} est remplacé par le numéro du bordereau.
reference = N° {numero} S.P.A.G/BRH

# Deuxième ligne en haut à gauche.
signataire = Le Directeur

# Image (PNG ou JPEG) placée en en-tête de chaque bordereau : logo + titre de l'établissement.
# Chemin complet, ou nom de fichier si l'image est dans le même dossier que ce fichier.
# Vide = pas d'en-tête.
logo = header.png

# Hauteur maximale du logo en centimètres (1 à 12). L'image occupe toute la largeur utile de la page
# (17 cm) tant que sa hauteur reste sous cette limite ; au-delà elle est réduite proportionnellement.
# Si l'image paraît trop petite, augmenter cette valeur (ex. 8). Les bordereaux déjà enregistrés
# gardent leur ancien en-tête jusqu'à leur prochaine modification.
logo_hauteur_max = 8

# Pied de page : adresse, puis téléphone / e-mail. Vide = pas de pied de page.
pied_ligne1 = Hôpital Mère Enfant, Boulevard Ibn Sina Marrakech
pied_ligne2 = Email : merenfant@gmail.com
pied_ligne3 = Tél: 024 30 70 29 - Fax: 024 30 68 69

# Destinataire proposé d'office dans un nouveau bordereau (l'utilisateur peut l'effacer et en taper un autre).
# Vide = champ vide. Exemple : destinataire_defaut = Mme la Directrice
destinataire_defaut = Mme. La Directrice de CHU Mohammed VI
# Nombre de lignes vides entre « Le Directeur » et la date.
lignes_vides_avant_date = 1

# Titre de la colonne des quantités.
colonne_nombre = Nbr
